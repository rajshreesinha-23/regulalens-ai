services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      REGULALENS_DB_PATH: /data/regulalens.db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - regulalens_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  regulalens_data: